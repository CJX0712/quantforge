name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single-threaded BLAS is required for the bit-identical determinism guarantee:
  # multi-threaded GEMM changes summation order between runs.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "ruff>=0.6"
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format --check
        run: python -m ruff format --check --diff . || true

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: pytest with coverage
        run: python -m pytest tests -q --cov=quantforge --cov-report=xml --cov-report=term

      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  smoke:
    name: demo smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .

      - name: run the shipped demo (includes the determinism re-run)
        run: python examples/run_demo.py --quick --outdir results

      - name: determinism must hold
        run: |
          python - <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path("results/benchmark.json").read_text(encoding="utf-8"))
          assert report["n_cells"] > 0, "demo produced no cells"
          for rec in report["records"]:
              for key in ("nmse", "act_err", "sqnr_db"):
                  assert rec[key] == rec[key], f"non-finite {key}"
          print(f"smoke ok: {report['n_cells']} cells, "
                f"flagship NMSE {report['flagship_nmse_mean']:.6e}")
          PY

      - name: upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-py${{ matrix.python-version }}
          path: results/benchmark.json
          if-no-files-found: error